  }

}

// ---------- melee core (Fei-hung, Siang) ----------
function meleeSwing(p, o) {
  const fx = p.x + p.w / 2, fy = p.y + p.h;
  const box = { x: p.face > 0 ? fx : fx - o.reach, y: fy + o.y0, w: o.reach, h: o.y1 - o.y0 };
  let hit = false;
  if (o.dmg > 0) for (const e of G.enemies) if (!e.dead && overlap(box, e)) {
    damageEnemy(e, o.dmg, fx, !!o.launch);
    if (!o.launch && !e.dead) e.vx = p.face * (e.type === 'heavy' ? 20 : 45);   // small push keeps them in combo range
    hit = true; gore(e.x + e.w / 2, e.y + 8, 2, 0.4);
  }
  const b = G.boss;
  if (o.dmg > 0 && b && !b.dead && b.dying <= 0 && b.state !== 'enter' && b.state !== 'roar' && overlap(box, b)) { damageBoss(o.bossDmg != null ? o.bossDmg : o.dmg, fx); hit = true; }
  if (o.dmg > 0) for (const br of G.barrels) if (!br.dead && overlap(box, br)) {
    hit = true;
    if (o.launch || o.kick) { br.vx = p.face * 260; br.vy = -190; br.kicked = true; if (br.lit < 0) { br.lit = 0.85; br.chain = ++G.chainSeq; audio.play('ignite'); } popup(br.x + 6, br.y - 6, 'KICK!', '#ffd23f'); }
    else { br.hp--; if (br.hp <= 0 && br.lit < 0) { br.lit = 0.75; br.chain = ++G.chainSeq; audio.play('ignite'); popup(br.x + 6, br.y - 8, 'RUN!', '#ff5a3a'); } }   // longer fuse: melee heroes get time to escape
  }
  let tileHit = false;
  for (let ty = Math.floor(box.y / TS); ty <= Math.floor((box.y + box.h - 1) / TS); ty++)
    for (let tx = Math.floor(box.x / TS); tx <= Math.floor((box.x + box.w - 1) / TS); tx++)
      if (o.dmg > 0 && DESTRUCT[tileAt(tx, ty)]) { damageTile(tx, ty, o.tile || 1); tileHit = true; }
  // fists and feet swat bullets out of the air
  for (let i = G.ebullets.length - 1; i >= 0; i--) {
    const eb = G.ebullets[i];
    if (eb.x > box.x - 3 && eb.x < box.x + box.w + 3 && eb.y > box.y - 3 && eb.y < box.y + box.h + 3) {
      G.ebullets.splice(i, 1); sparks(eb.x, eb.y, 4, p.face, '#ffffff'); G.stats.deflect++; hit = true;
    }
  }
  const sx = fx + p.face * o.reach * 0.8, sy = fy + (o.y0 + o.y1) / 2;
  if (o.quiet) return hit;
  if (hit) { G.stats.melee++; audio.play(p.ch === 'ximen' ? 'clang' : 'punch'); hitstop(0.028); sparks(sx, sy, 4, p.face, '#fff2b0'); if (p.ch === 'fei') p.chi = Math.min(3, p.chi + 0.1); }
  else if (tileHit) { audio.play('tile'); sparks(sx, sy, 2, -p.face, '#ffcf7a'); }
  else audio.play('whoosh');
  return hit;
}

function curveBullet(b, dt) {    // steer toward the nearest live target, anywhere — the bullet "bends"
  let tgt = b.tgt;
  if (!tgt || tgt.dead || (tgt === G.boss && tgt.dying > 0)) {
    tgt = null; let bd = 1e9;
    for (const e of G.enemies) if (!e.dead && !e.para && onScreen(e, 10)) { const d = Math.hypot(e.x + e.w / 2 - b.x, e.y + e.h / 2 - b.y); if (d < bd) { bd = d; tgt = e; } }
    const bo = G.boss; if (!tgt && bo && !bo.dead && bo.dying <= 0 && bo.state !== 'enter') tgt = bo;
    b.tgt = tgt;
  }
  if (!tgt) return;
  const sp = Math.hypot(b.vx, b.vy), a0 = Math.atan2(b.vy, b.vx), a1 = Math.atan2(tgt.y + tgt.h * 0.45 - b.y, tgt.x + tgt.w / 2 - b.x);

}

function addDecal(x, y, wall) {

}
function drawDecals() {
  if (!G.decals || !BLOOD) return;
  for (const d of G.decals) {
    if (d.grow > 0) { const g = Math.min(d.grow, 0.02); d.w += g; d.x -= g / 2; d.grow -= 0.02; }
    if (d.x + d.w < G.cam.x - 10 || d.x > G.cam.x + VW + 10) continue;
    ctx.globalAlpha = d.a; ctx.fillStyle = '#5e0a0a'; ctx.fillRect(d.x, d.y, d.w, d.h); ctx.fillStyle = '#8a1414'; ctx.fillRect(d.x, d.y, d.w, 1);
  }

}
function bloodScreen(strength) {
  if (!BLOOD) return; const S = G.sblood = G.sblood || [];

  const n = Math.round(1 + strength * 2);
  for (let i = 0; i < n; i++) S.push({ x: rnd(0, VW), y: rnd(0, VH), r: rnd(6, 22) * (0.6 + strength), t: 0, drops: Array.from({ length: 4 }, () => [rnd(-1, 1), rnd(-1, 1), rnd(0.2, 0.5)]) });
  if (S.length > 10) S.splice(0, S.length - 10);
}
function drawScreenBlood(dt) {
  if (!G.sblood || !BLOOD) return;
  for (let i = G.sblood.length - 1; i >= 0; i--) {
    const s = G.sblood[i]; s.t += dt; if (s.t > 1.8) { G.sblood.splice(i, 1); continue; }
    const a = s.t < 1.0 ? 0.32 : 0.32 * Math.max(0, 1 - (s.t - 1.0) / 0.8), run = Math.min(30, s.t * 14);
    ctx.globalAlpha = a; ctx.fillStyle = '#6a0808';
    ctx.beginPath(); ctx.arc(s.x, s.y, s.r, 0, 6.283); ctx.fill();
    for (const [dx, dy, k] of s.drops) { ctx.beginPath(); ctx.arc(s.x + dx * s.r * 1.4, s.y + dy * s.r * 1.4, s.r * k, 0, 6.283); ctx.fill(); }
    ctx.fillRect(s.x - 1.5, s.y, 3, run);                  // it runs down the lens
  }
  ctx.globalAlpha = 1;
}

function drawRings() {

// STAGE 01 PRESENTATION LAYER — "HOLLYWOOD EXPLOSION" OVERHAUL
// Visual only. Rules this block follows so gameplay cannot change:
//   * it never writes to G (or anything the simulation reads); it only reads state,
//   * it never calls Math.random / rnd (own PRNG below), so the game's random sequence is untouched,
//   * it never calls audio, hitstop(), shake() or anything that changes timing.
// Only active while STAGE === 1. Stages 02/03 take the original code paths.
// =====================================================================
const FXR = mulberry(90210);

  // shown smaller than 2x on screen: let the browser average the double-density pixels instead of dropping every other one

// ---------- texture bank (built once) ----------
const FXT = { fire: [], smoke: [], dust: [], glow: {}, flare: null };
function buildFxTextures() {
  const R = mulberry(5150);
  const PAL = {
    white: ['#ffffff', '#fffbe0', '#fff0a8', '#ffd870'],
    yellow: ['#fff8c0', '#ffe060', '#ffb030', '#f07a1c'],
    orange: ['#ffc848', '#ff9024', '#e8581c', '#b0321a'],
    red: ['#ff8a30', '#dc461c', '#a02a18', '#621a14'],
    ember: ['#b04a20', '#782a1c', '#46201e', '#2c181c'],
    smoke: ['#6e5e62', '#4e424a', '#383038', '#241c26'],
    dust: ['#c4b090', '#a49074', '#82725e', '#5e5044']
  };
  const blob = (pal, seed) => {
    const N = 32, c = mkCanvas(N, N), g = c.getContext('2d'), rr = mulberry(seed);
    const lobes = []; for (let i = 0; i < 6; i++) lobes.push([rr() * 6.283, 0.08 + rr() * 0.14, 2 + (rr() * 3 | 0)]);
    for (let y = 0; y < N; y++) for (let x = 0; x < N; x++) {
      const dx = (x + 0.5 - N / 2) / (N / 2), dy = (y + 0.5 - N / 2) / (N / 2), a = Math.atan2(dy, dx);
      let rad = 0.86; for (const [ph, amp, f] of lobes) rad += Math.sin(a * f + ph) * amp * 0.5;
      const d = Math.hypot(dx, dy) / rad; if (d > 1) continue;
      let v = d * 0.75 + (dx + dy) * 0.18 + 0.12 + (rr() - 0.5) * 0.08;                // light from the top-left
      const dith = ((x + y) & 1) * 0.07; v += dith;
      const i = v < 0.32 ? 0 : v < 0.55 ? 1 : v < 0.78 ? 2 : 3;
      g.fillStyle = pal[i]; g.fillRect(x, y, 1, 1);
    }
    return c;
  };
  for (const k of ['white', 'yellow', 'orange', 'red', 'ember']) { const a = []; for (let v = 0; v < 4; v++) a.push(blob(PAL[k], (R() * 1e9) | 0)); FXT.fire.push(a); }
  for (let v = 0; v < 4; v++) FXT.smoke.push(blob(PAL.smoke, (R() * 1e9) | 0));
  for (let v = 0; v < 4; v++) FXT.dust.push(blob(PAL.dust, (R() * 1e9) | 0));
  for (const [k, col] of [['warm', '255,170,80'], ['white', '255,245,220'], ['red', '255,50,40'], ['blue', '140,190,255']]) {
    const c = mkCanvas(64, 64), g = c.getContext('2d'), gr = g.createRadialGradient(32, 32, 0, 32, 32, 32);
    gr.addColorStop(0, 'rgba(' + col + ',1)'); gr.addColorStop(0.35, 'rgba(' + col + ',0.45)'); gr.addColorStop(1, 'rgba(' + col + ',0)');
    g.fillStyle = gr; g.fillRect(0, 0, 64, 64); FXT.glow[k] = c;
  }
}

const FXN = 1000;

function fxp(k, x, y, vx, vy, life, size, o) {

  q.grow = 0; q.g = 0; q.drag = 0; q.rot = 0; q.vr = 0; q.v = (FXR() * 4) | 0; q.delay = 0; q.a = 1; q.col = null; q.heat = 0; q.rest = false; q.lw = 2;

    ctx.fillStyle = '#9a7432'; ctx.fillRect(-12, 16, 24, 1.5); ctx.fillRect(-9.5, 4, 19, 1); ctx.fillStyle = '#c89a4a'; ctx.fillRect(-6, 2, 2, 14);

  }

// ---------- Golden Men (HD) ----------
// The hundred share a sprite cache: each pose/frame is drawn once (outline and all), then stamped.
const CROWDC = new Map();
function drawCrowdCached(e, ph, moving) {
  const k = Math.max(1, Math.round(ctx.getTransform().a > 0 ? Math.hypot(ctx.getTransform().a, ctx.getTransform().b) : 1));
  const air = !e.onGround && !e.dead, st = e.dead ? 'dead' : (e.state === 'wind' || e.state === 'pose') ? e.state : 'mill';
  const fr = moving && !air ? Math.floor(((ph % 6.283) + 6.283) % 6.283 / 6.283 * 8) : 0;
  const key = st + fr + (moving ? 'm' : '') + (air ? (e.vy < 0 ? 'u' : 'd') : '') + (FLASH ? 'f' : '') + (e.staff ? 's' : '') + k;
  let c = CROWDC.get(key);

    ctx = cx; try { (S1HD() ? drawMonkHD : drawMonk)(fake, fr * 6.283 / 8, moving); } finally { ctx = main; }
    if (CROWDC.size > 400) CROWDC.clear(); CROWDC.set(key, c);

}

    else legsHD(ph, moving, !e.onGround, e.vy, GD2, GDK, '#5a3a08', 8);
    hp(-4.5, -16.5, 9, 8.5, GD); hp(-4.5, -16.5, 1.5, 8.5, GD2); hp(-2, -16, 2, 4, GDH); hp(1.5, -15, 1, 3, GD3); hp(-1, -12, 4, 0.5, GD2);      // chest + highlight
    hp(-4.5, -9.5, 9, 2, SASH); hp(-4.5, -9.5, 9, 0.5, '#ff5a40'); hp(-5.5, -9, 1.5, 4, '#a01818');                                               // sash
    for (let i = 0; i < 5; i++) hp(-3 + i * 1.4, -16 + i * 1.2, 1, 1, '#5a2a10');                                                                   // prayer beads
    hp(-3.5, -22.5, 7, 6.5, GD); hp(-3.5, -22.5, 1.5, 6.5, GD2); hp(-1.5, -22.5, 3.5, 1, GDH); hp(1.5, -20, 1.5, 0.5, '#5a3a00'); hp(1, -21, 2, 0.5, GD2); hp(-3.5, -16.5, 7, 0.5, GD2);
    for (let r = 0; r < 2; r++) for (let i = 0; i < 3; i++) hp(-2 + i * 1.6, -22.2 + r * 1.2, 0.75, 0.75, GDK);                                        // burn marks 戒疤
    if (e.form === 'wall' && !atk) { hp(-8, -15.5, 18, 2, GD); hp(-8, -15.5, 18, 0.5, GDH); hp(-9.5, -16.5, 2.5, 3, GD3); hp(9, -16.5, 2.5, 3, GD3); }

  }
}

// =====================================================================
// MAIN LOOP
// =====================================================================
let lastT = performance.now(), acc = 0;
function startGame() { newGame('play'); audio.unlock(); acc = 0; startIntro(); }
function frame(now) {
  let dt = Math.min(0.1, (now - lastT) / 1000); lastT = now;
  pollPad();
  const ip = {}; for (const k in pressed) { ip[k] = true; delete pressed[k]; }
  for (const k of ['left', 'right', 'up', 'down']) TAP[k] = !!(ip[k] && !keys[k]);
  if (ip.music) audio.toggle();
  if (ip.blood) { BLOOD = !BLOOD; if (G.player) popup(G.player.x + 5, G.player.y - 20, BLOOD ? 'BLOOD: ON' : 'BLOOD: OFF', '#ff5a5a'); }
  if (G.mode === 'map') { G.clock += dt; updMap(ip); }
  else if (G.mode === 'title' || G.mode === 'select') {
    G.clock += dt; G.cam.x = (G.cam.x + dt * 20) % (40 * TS); G.cam.y = 18 * TS - VH * 0.75;
    if (G.mode === 'title') { if (ip.start || ip.jump || ip.shoot) enterMap(); }
    else {
      G.selT += dt; updUIDoves(dt);
      const n = CHAR_KEYS.length;
      if (ip.left) { G.sel = (G.sel + n - 1) % n; audio.play('bounce'); }
      if (ip.right) { G.sel = (G.sel + 1) % n; audio.play('bounce'); }
      if (ip.down) { G.sel = G.sel + CARD.cols < n ? G.sel + CARD.cols : G.sel % CARD.cols; audio.play('bounce'); }
      if (ip.up) { if (G.sel - CARD.cols >= 0) G.sel -= CARD.cols; else { let j = G.sel; while (j + CARD.cols < n) j += CARD.cols; G.sel = j; } audio.play('bounce'); }
      let num = -1; ['c1', 'c2', 'c3', 'c4', 'c5', 'c6', 'c7', 'c8', 'c9', 'c10', 'c11', 'c12', 'c13'].forEach((c, i) => { if (ip[c] && i < n) num = i; });
      if (num >= 0) G.sel = num;
      if (ip.stage) { STAGE = STAGE % 3 + 1; audio.play('check'); }
      if (ip.pause && G.selT > 0.25) { enterMap(); return; }

      if (ip.click && G.selT > 0.25) { const c = cardAt(mouse.x, mouse.y); if (c >= 0) { if (c === G.sel) go = true; G.sel = c; } }
      if (G.denyT > 0) G.denyT -= dt;
      if (num >= 0 && !isUnlocked(CHAR_KEYS[G.sel])) go = false;          // number key on a locked hero: just show its requirement
      if (go && !isUnlocked(CHAR_KEYS[G.sel])) { go = false; G.denyT = 0.8; audio.play('warn'); }
      if (go) { CHOSEN = CHAR_KEYS[G.sel]; PROG.fresh = PROG.fresh.filter(c => c !== CHOSEN); saveProg(); audio.play('check'); startGame(); }
    }

G.cam.y = 18 * TS - VH * 0.75;

};

<script>
// NEIGHBORHOOD OF CHAOS: on-screen controls for touch devices. They feed the same keys/pressed tables as the keyboard.
(function () {
  const T = document.getElementById('touch');
  const touchy = ('ontouchstart' in window) || (window.matchMedia && matchMedia('(pointer:coarse)').matches) || /[?&]touch=1/.test(location.search);
  if (!touchy) return;
  T.style.display = 'block';
  for (const b of T.querySelectorAll('b')) {
    const a = b.dataset.a;
    const down = e => { e.preventDefault(); if (!keys[a]) pressed[a] = true; keys[a] = true; b.classList.add('on'); try { audio.unlock(); } catch (_) { } };
    const up = e => { e.preventDefault(); keys[a] = false; b.classList.remove('on'); };
    b.addEventListener('touchstart', down, { passive: false }); b.addEventListener('touchend', up, { passive: false }); b.addEventListener('touchcancel', up, { passive: false });
    b.addEventListener('pointerdown', e => { if (e.pointerType !== 'touch') down(e); }); b.addEventListener('pointerup', e => { if (e.pointerType !== 'touch') up(e); });
  }
})();
</script>
